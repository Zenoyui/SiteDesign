<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор макетов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&family=Onest:wght@400;500;700;800&family=Manrope:wght@400;600;800&family=Unbounded:wght@400;600;800&family=Rubik:wght@400;500;700;900&family=Nunito:wght@400;700;900&family=Montserrat:wght@400;600;800&family=Golos+Text:wght@400;600;800&family=PT+Serif:wght@400;700&family=Comfortaa:wght@400;700&family=Russo+One&family=Inter:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=PT+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="split">
  <aside id="left">
    <header class="doc-head">
      <div class="org">Конструктор макетов для печати</div>
      <h1>От идеи до готового макета</h1>
      <div class="meta"><span id="stepCounter"></span> · <button class="link" id="randomIdea" title="Случайная комбинация ответов">Случайная идея</button> · <button class="link" id="resetAll">Начать заново</button></div>
    </header>
    <nav id="toc"></nav>
    <section id="step"></section>
    <footer class="nav-btns">
      <button class="btn" id="prevStep">← Назад</button>
      <button class="btn primary" id="nextStep">Далее →</button>
    </footer>
  </aside>

  <main id="right">
    <div class="rbar">
      <div id="pageTabs" class="tabs"></div>
      <div class="rbar-right">
        <div class="seg" id="viewSwitch">
          <button data-view="edit" class="on">Редактор</button>
          <button data-view="all">Все стороны</button>
          <button data-view="mock">Как в жизни</button>
        </div>
        <div class="zoom">
          <button class="btn sm" id="zoomOut" title="Уменьшить (Ctrl −)">−</button>
          <button class="btn sm" id="zoomFit" title="По размеру (Shift+1)"><span id="zoomVal">100%</span></button>
          <button class="btn sm" id="zoomIn" title="Увеличить (Ctrl +)">+</button>
        </div>
        <button class="btn primary sm" id="goExport">Скачать</button>
      </div>
    </div>

    <div id="stage" tabindex="0">
      <div id="paper">
        <canvas id="canvas"></canvas>
        <svg id="overlay"></svg>
      </div>
    </div>
    <div id="allView" class="hidden"></div>
    <div id="mockView" class="hidden"></div>

    <div id="toolbar">
      <button data-tool="move" class="on" title="Выбор и перемещение (V)"><svg viewBox="0 0 20 20"><path d="M5 3l10 7-4.5 1 2.5 5-2 1-2.5-5L5 15z"/></svg></button>
      <button data-tool="rect" title="Прямоугольник (R)"><svg viewBox="0 0 20 20"><rect x="3.5" y="5.5" width="13" height="9" fill="none" stroke-width="1.5"/></svg></button>
      <button data-tool="ellipse" title="Эллипс (O)"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="6.5" ry="5.5" fill="none" stroke-width="1.5"/></svg></button>
      <button data-tool="line" title="Линия (L)"><svg viewBox="0 0 20 20"><path d="M4 16L16 4" stroke-width="1.5"/></svg></button>
      <button data-tool="star" title="Звезда / бейдж (S)"><svg viewBox="0 0 20 20"><path d="M10 3l2 4.6 5 .5-3.8 3.3 1.1 4.9L10 13.8 5.7 16.3l1.1-4.9L3 8.1l5-.5z" fill="none" stroke-width="1.3"/></svg></button>
      <button data-tool="icon" title="Значок (K)"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke-width="1.3"/><path d="M6.5 10.5l2.3 2.3 4.7-5" fill="none" stroke-width="1.5"/></svg></button>
      <button data-tool="text" title="Текст (T)"><svg viewBox="0 0 20 20"><path d="M4 5h12M10 5v11M7.5 16h5" stroke-width="1.6"/></svg></button>
      <button data-tool="image" title="Изображение (I)"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" fill="none" stroke-width="1.4"/><path d="M3 14l4-4 3 3 2-2 5 5" fill="none" stroke-width="1.4"/><circle cx="13" cy="7.5" r="1.3"/></svg></button>
      <button data-tool="qr" title="QR-код"><svg viewBox="0 0 20 20"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM12 12h2v2h-2zM15 15h2v2h-2zM15 11h2v2h-2zM11 15h2v2h-2z" fill="none" stroke-width="1.2"/></svg></button>
      <span class="sep"></span>
      <button id="undoBtn" title="Отменить (Ctrl+Z)"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3 9h9a5 5 0 010 10h-2" fill="none" stroke-width="1.5"/></svg></button>
      <button id="redoBtn" title="Повторить (Ctrl+Shift+Z)"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4M17 9H8a5 5 0 000 10h2" fill="none" stroke-width="1.5"/></svg></button>
    </div>
    <input type="file" id="imageInput" accept="image/*" hidden>
    <input type="file" id="projectInput" accept=".json,application/json" hidden>
    <div id="toast"></div>
  </main>
</div>

<!-- Основа: помощники, цвет, значки -->
<script src="js/core/util.js"></script>
<script src="js/core/color.js"></script>
<script src="js/core/icons.js"></script>
<!-- Справочники: стили, форматы, эффекты, сферы, маркетинг, образы брендов -->
<script src="js/data/styles-services.js"></script>
<script src="js/data/styles-tech.js"></script>
<script src="js/data/styles-directions.js"></script>
<script src="js/data/style-meta.js"></script>
<script src="js/data/formats.js"></script>
<script src="js/data/kits.js"></script>
<script src="js/data/industries.js"></script>
<script src="js/data/marketing.js"></script>
<script src="js/data/recipes.js"></script>
<!-- Отрисовка на canvas -->
<script src="js/render/assets.js"></script>
<script src="js/render/text.js"></script>
<script src="js/render/paint.js"></script>
<script src="js/render/draw.js"></script>
<!-- Оценка и проверка: линтер, дизайн-мозг, готовность, вкус, серия -->
<script src="js/quality/lint.js"></script>
<script src="js/quality/brain.js"></script>
<script src="js/quality/ready.js"></script>
<script src="js/quality/taste.js"></script>
<script src="js/quality/series.js"></script>
<!-- Генератор макета -->
<script src="js/gen/palette.js"></script>
<script src="js/gen/blocks.js"></script>
<script src="js/gen/effects.js"></script>
<script src="js/gen/motifs.js"></script>
<script src="js/gen/front.js"></script>
<script src="js/gen/back.js"></script>
<script src="js/gen/build.js"></script>
<!-- Состояние -->
<script src="js/app/state.js"></script>
<!-- Редактор и панель свойств -->
<script src="js/editor/view.js"></script>
<script src="js/editor/mouse.js"></script>
<script src="js/editor/actions.js"></script>
<script src="js/editor/keys.js"></script>
<script src="js/panel/controls.js"></script>
<script src="js/panel/element.js"></script>
<script src="js/panel/layers.js"></script>
<!-- Мастер (левая половина) -->
<script src="js/wizard/core.js"></script>
<script src="js/wizard/steps-start.js"></script>
<script src="js/wizard/steps-content.js"></script>
<script src="js/wizard/steps-look.js"></script>
<script src="js/wizard/steps-auto.js"></script>
<script src="js/wizard/steps-result.js"></script>
<script src="js/wizard/index.js"></script>
<!-- Скачивание, виды, запуск -->
<script src="js/app/export.js"></script>
<script src="js/app/views.js"></script>
<script src="js/app/main.js"></script>
</body>
</html>
